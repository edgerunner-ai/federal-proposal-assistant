<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Integration Path — Build · Integrate · Evaluate · Iterate</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#191c20;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;justify-content:center;align-items:flex-start;padding:20px}
  .canvas{width:1200px;background:#191c20;border-radius:12px;
          overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .header{padding:26px 36px 16px;text-align:center;border-bottom:3px solid #ee2929}
  .header h1{color:#ffffff;font-size:46px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .header p{color:#9f9f9f;font-size:27px;margin-top:8px}
</style>
</head>
<body>
<div class="canvas">
  <div class="header">
    <h1>Integration Path — Build · Integrate · Evaluate · Iterate</h1>
    <p>90&ndash;120 days from award to TRL 6 assessment</p>
  </div>

  <!-- Axis: Day 0 at x=300, Day 120 at x=1130 -> 6.917 px/day -->
  <svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <!-- axis grid -->
    <line x1="300" y1="100" x2="300" y2="540" stroke="#393939" stroke-width="1.5"/>
    <line x1="507" y1="100" x2="507" y2="540" stroke="#393939" stroke-width="1.5"/>
    <line x1="715" y1="100" x2="715" y2="540" stroke="#393939" stroke-width="1.5"/>
    <line x1="922" y1="100" x2="922" y2="540" stroke="#393939" stroke-width="1.5"/>
    <line x1="1130" y1="100" x2="1130" y2="540" stroke="#ee2929" stroke-width="2"/>
    <text x="300" y="86" fill="#9f9f9f" font-size="24" font-family="Segoe UI" text-anchor="middle">Day 0</text>
    <text x="507" y="86" fill="#9f9f9f" font-size="24" font-family="Segoe UI" text-anchor="middle">Day 30</text>
    <text x="715" y="86" fill="#9f9f9f" font-size="24" font-family="Segoe UI" text-anchor="middle">Day 60</text>
    <text x="922" y="86" fill="#9f9f9f" font-size="24" font-family="Segoe UI" text-anchor="middle">Day 90</text>
    <text x="1130" y="86" fill="#ee2929" font-size="24" font-weight="700" font-family="Segoe UI" text-anchor="middle">Day 120</text>

    <!-- Lane 1: Days 1-90 -> x 307 to 922 -->
    <text x="30" y="158" fill="#ffffff" font-size="27" font-weight="700" font-family="Segoe UI">Phase 1</text>
    <text x="30" y="188" fill="#9f9f9f" font-size="24" font-family="Segoe UI">UxS Platform</text>
    <text x="30" y="216" fill="#9f9f9f" font-size="24" font-family="Segoe UI">Drivers</text>
    <rect x="307" y="135" width="615" height="64" rx="10" fill="rgba(238,41,41,.10)" stroke="#ee2929" stroke-width="2"/>
    <!-- M1.1 d10, M1.2 d45, M1.3 d75, M1.4 d90 -->
    <circle cx="369" cy="167" r="11" fill="#ee2929"/><text x="369" y="225" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M1.1</text>
    <circle cx="611" cy="167" r="11" fill="#ee2929"/><text x="611" y="225" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M1.2</text>
    <circle cx="819" cy="167" r="11" fill="#ee2929"/><text x="819" y="225" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M1.3</text>
    <circle cx="922" cy="167" r="11" fill="#ee2929"/><text x="922" y="225" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M1.4</text>

    <!-- Lane 2: Days 30-90 -> x 507 to 922 -->
    <text x="30" y="298" fill="#ffffff" font-size="27" font-weight="700" font-family="Segoe UI">Phase 2</text>
    <text x="30" y="328" fill="#9f9f9f" font-size="24" font-family="Segoe UI">COP &amp; C2</text>
    <text x="30" y="356" fill="#9f9f9f" font-size="24" font-family="Segoe UI">Integration</text>
    <rect x="507" y="275" width="415" height="64" rx="10" fill="rgba(238,41,41,.10)" stroke="#ee2929" stroke-width="2"/>
    <!-- M2.1 d40, M2.2 d65, M2.3 d90 -->
    <circle cx="576" cy="307" r="11" fill="#ee2929"/><text x="576" y="365" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M2.1</text>
    <circle cx="749" cy="307" r="11" fill="#ee2929"/><text x="749" y="365" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M2.2</text>
    <circle cx="922" cy="307" r="11" fill="#ee2929"/><text x="900" y="365" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M2.3</text>

    <!-- Lane 3: Days 60-120 -> x 715 to 1130 -->
    <text x="30" y="438" fill="#ffffff" font-size="27" font-weight="700" font-family="Segoe UI">Phase 3</text>
    <text x="30" y="468" fill="#9f9f9f" font-size="24" font-family="Segoe UI">EVELYN +</text>
    <text x="30" y="496" fill="#9f9f9f" font-size="24" font-family="Segoe UI">Operator Test</text>
    <rect x="715" y="415" width="415" height="64" rx="10" fill="rgba(238,41,41,.10)" stroke="#ee2929" stroke-width="2"/>
    <!-- M3.1 d70, M3.3 d85, M3.6 d120 -->
    <circle cx="784" cy="447" r="11" fill="#ee2929"/><text x="784" y="505" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M3.1</text>
    <circle cx="888" cy="447" r="11" fill="#ee2929"/><text x="888" y="505" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M3.3</text>
    <circle cx="1130" cy="447" r="11" fill="#ee2929"/><text x="1108" y="505" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">M3.6</text>

    <!-- TRL 6 gate -->
    <polygon points="1130,540 1148,562 1130,584 1112,562" fill="#ee2929"/>
    <text x="1130" y="624" fill="#ee2929" font-size="26" font-weight="700" font-family="Segoe UI" text-anchor="end">TRL 6 Assessment</text>

    <!-- parallel note -->
    <text x="307" y="624" fill="#9f9f9f" font-size="24" font-family="Segoe UI">Phases 1 and 2 run in parallel</text>
  </svg>
</div>
</body>
</html>
