<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EVELYN — Continuous Perception Adaptation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#191c20;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;justify-content:center;align-items:flex-start;padding:20px}
  .canvas{width:1200px;background:#191c20;border-radius:12px;
          box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .header{padding:26px 36px 18px;text-align:center;border-bottom:3px solid #ee2929}
  .header h1{color:#ffffff;font-size:48px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<body>
<div class="canvas">
  <div class="header">
    <h1>EVELYN — Continuous Perception Adaptation</h1>
  </div>

  <svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs>
      <marker id="ar" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
        <polygon points="0 0,11 4.5,0 9" fill="#ee2929"/>
      </marker>
    </defs>

    <!-- arc arrows around circle centered (600,440) r=320 -->
    <path d="M 760 175 A 320 320 0 0 1 920 440" fill="none" stroke="#ee2929" stroke-width="4" marker-end="url(#ar)" opacity=".75"/>
    <path d="M 920 440 A 320 320 0 0 1 760 705" fill="none" stroke="#ee2929" stroke-width="4" marker-end="url(#ar)" opacity=".75"/>
    <path d="M 440 705 A 320 320 0 0 1 280 440" fill="none" stroke="#ee2929" stroke-width="4" marker-end="url(#ar)" opacity=".75"/>
    <path d="M 280 440 A 320 320 0 0 1 440 175" fill="none" stroke="#ee2929" stroke-width="4" marker-end="url(#ar)" opacity=".75"/>

    <!-- center -->
    <circle cx="600" cy="440" r="150" fill="rgba(238,41,41,.07)" stroke="#ee2929" stroke-width="2" opacity=".55"/>
    <text x="600" y="408" fill="#ee2929" font-size="27" font-weight="700" font-family="Segoe UI" text-anchor="middle">Collect &#8594; Label</text>
    <text x="600" y="444" fill="#ee2929" font-size="27" font-weight="700" font-family="Segoe UI" text-anchor="middle">&#8594; Retrain &#8594;</text>
    <text x="600" y="480" fill="#ee2929" font-size="27" font-weight="700" font-family="Segoe UI" text-anchor="middle">Distribute</text>
    <text x="600" y="520" fill="#c8c8c8" font-size="24" font-family="Segoe UI" text-anchor="middle">within the operational period</text>

    <!-- NODE COLLECT (top) -->
    <rect x="370" y="40" width="460" height="150" rx="14" fill="#2a2d31" stroke="#393939" stroke-width="2"/>
    <rect x="370" y="40" width="460" height="7" rx="3" fill="#ee2929"/>
    <text x="600" y="98" fill="#ffffff" font-size="34" font-weight="700" font-family="Segoe UI" text-anchor="middle">COLLECT</text>
    <text x="600" y="140" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">Novel-target imagery</text>
    <text x="600" y="172" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">from UxS sensors</text>

    <!-- NODE LABEL (right) -->
    <rect x="855" y="350" width="320" height="180" rx="14" fill="#2a2d31" stroke="#393939" stroke-width="2"/>
    <rect x="855" y="350" width="320" height="7" rx="3" fill="#ee2929"/>
    <text x="1015" y="408" fill="#ffffff" font-size="34" font-weight="700" font-family="Segoe UI" text-anchor="middle">LABEL</text>
    <text x="1015" y="450" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">100+ images / second</text>
    <text x="1015" y="482" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">on-device</text>

    <!-- NODE RETRAIN (bottom) -->
    <rect x="370" y="690" width="460" height="170" rx="14" fill="#2a2d31" stroke="#393939" stroke-width="2"/>
    <rect x="370" y="690" width="460" height="7" rx="3" fill="#ee2929"/>
    <text x="600" y="746" fill="#ffffff" font-size="34" font-weight="700" font-family="Segoe UI" text-anchor="middle">RETRAIN</text>
    <text x="600" y="788" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">Fine-tune a detection model</text>
    <text x="600" y="820" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">on a ruggedized laptop</text>
    <text x="600" y="850" fill="#9f9f9f" font-size="24" font-family="Segoe UI" text-anchor="middle">hours, not days</text>

    <!-- NODE DISTRIBUTE (left) -->
    <rect x="25" y="350" width="320" height="180" rx="14" fill="#2a2d31" stroke="#393939" stroke-width="2"/>
    <rect x="25" y="350" width="320" height="7" rx="3" fill="#ee2929"/>
    <text x="185" y="408" fill="#ffffff" font-size="34" font-weight="700" font-family="Segoe UI" text-anchor="middle">DISTRIBUTE</text>
    <text x="185" y="450" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">Push to the whole</text>
    <text x="185" y="482" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">collective; no</text>
    <text x="185" y="514" fill="#c8c8c8" font-size="26" font-family="Segoe UI" text-anchor="middle">connectivity required</text>
  </svg>
</div>
</body>
</html>
