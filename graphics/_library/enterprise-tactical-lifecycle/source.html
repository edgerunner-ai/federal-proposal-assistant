<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1 — Enterprise-to-Tactical AI Lifecycle</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#191c20;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;justify-content:center;align-items:center;
       min-height:100vh;padding:20px}
  .canvas{width:1200px;background:#191c20;border-radius:12px;
          overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .caption{padding:14px 32px 20px;color:#9f9f9f;font-size:12px;
           line-height:1.6;border-top:1px solid #393939}
  .caption strong{color:#c8c8c8}
</style>
</head>
<body>
<div class="canvas">

  <div style="padding:18px 32px 8px;text-align:center;border-bottom:2px solid #ee2929">
    <h1 style="color:#ffffff;font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase">Enterprise-to-Tactical AI Lifecycle</h1>
  </div>

  <svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs>
      <marker id="ad" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#FFFFFF"/>
      </marker>
      <marker id="au" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#ee2929"/>
      </marker>
    </defs>

    <!-- ============ ENTERPRISE TIER ============ -->
    <rect x="200" y="20" width="800" height="115" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="600" y="52" fill="#FFFFFF" font-size="26" font-weight="700" font-family="Segoe UI" text-anchor="middle">ENTERPRISE TIER</text>
    <text x="600" y="76" fill="#c8c8c8" font-size="18" font-family="Segoe UI" text-anchor="middle">CONUS / CDAO</text>
    <text x="340" y="106" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Frontier Model Eval</text>
    <text x="600" y="106" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Security &amp; Governance</text>
    <text x="860" y="106" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Training Data Aggregation</text>
    <line x1="470" y1="92" x2="470" y2="118" stroke="#393939" stroke-width="1" opacity=".5"/>
    <line x1="730" y1="92" x2="730" y2="118" stroke="#393939" stroke-width="1" opacity=".5"/>
    <rect x="410" y="122" width="380" height="32" rx="16" fill="#ee2929"/>
    <text x="600" y="143" fill="#191c20" font-size="17" font-weight="700" font-family="Segoe UI" text-anchor="middle">ENTERPRISE MODEL REGISTRY</text>

    <!-- Arrows -->
    <line x1="380" y1="158" x2="380" y2="200" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ad)"/>
    <line x1="820" y1="200" x2="820" y2="158" stroke="#ee2929" stroke-width="2" marker-end="url(#au)"/>
    <text x="392" y="178" fill="#c8c8c8" font-size="15" font-weight="600" font-family="Segoe UI">Models</text>
    <text x="808" y="178" fill="#ee2929" font-size="15" font-weight="600" font-family="Segoe UI" text-anchor="end">Op Data</text>

    <!-- Security boundary -->
    <line x1="250" y1="182" x2="950" y2="182" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="505" y="173" width="190" height="20" rx="10" fill="#222528" stroke="#4a4a4a" stroke-width="1"/>
    <text x="600" y="187" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">SECURITY BOUNDARY</text>

    <!-- ============ GCC TIER ============ -->
    <rect x="200" y="208" width="800" height="115" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="600" y="240" fill="#FFFFFF" font-size="26" font-weight="700" font-family="Segoe UI" text-anchor="middle">GCC TIER</text>
    <text x="600" y="264" fill="#c8c8c8" font-size="18" font-family="Segoe UI" text-anchor="middle">GCC / Theater Commands</text>
    <text x="340" y="294" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Theater Fine-Tuning</text>
    <text x="600" y="294" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">MOS LoRA Creation</text>
    <text x="860" y="294" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Data Curation</text>
    <line x1="470" y1="280" x2="470" y2="306" stroke="#393939" stroke-width="1" opacity=".5"/>
    <line x1="730" y1="280" x2="730" y2="306" stroke="#393939" stroke-width="1" opacity=".5"/>
    <rect x="410" y="310" width="380" height="32" rx="16" fill="#ee2929"/>
    <text x="600" y="331" fill="#191c20" font-size="17" font-weight="700" font-family="Segoe UI" text-anchor="middle">GCC MODEL REGISTRY</text>

    <!-- Arrows -->
    <line x1="380" y1="348" x2="380" y2="392" stroke="#FFFFFF" stroke-width="2" marker-end="url(#ad)"/>
    <line x1="820" y1="392" x2="820" y2="348" stroke="#ee2929" stroke-width="2" marker-end="url(#au)"/>
    <text x="392" y="368" fill="#c8c8c8" font-size="15" font-weight="600" font-family="Segoe UI">Models + LoRAs</text>
    <text x="808" y="368" fill="#ee2929" font-size="15" font-weight="600" font-family="Segoe UI" text-anchor="end">Store &amp; Forward</text>

    <!-- DDIL boundary -->
    <line x1="250" y1="372" x2="950" y2="372" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="515" y="363" width="170" height="20" rx="10" fill="#222528" stroke="#4a4a4a" stroke-width="1"/>
    <text x="600" y="377" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">DDIL BOUNDARY</text>

    <!-- ============ TACTICAL EDGE TIER ============ -->
    <rect x="200" y="398" width="800" height="95" rx="10" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="2"/>
    <text x="600" y="430" fill="#ee2929" font-size="26" font-weight="700" font-family="Segoe UI" text-anchor="middle">TACTICAL EDGE — ON-DEVICE</text>
    <text x="600" y="454" fill="#c8c8c8" font-size="18" font-family="Segoe UI" text-anchor="middle">DDIL / Forward Deployed</text>
    <text x="340" y="480" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">EdgeRunner AI Runtime</text>
    <text x="600" y="480" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Agentic Workflows</text>
    <text x="860" y="480" fill="#FFFFFF" font-size="19" font-family="Segoe UI" text-anchor="middle">Op Data Capture</text>
    <line x1="470" y1="466" x2="470" y2="490" stroke="#ee2929" stroke-width="1" opacity=".5"/>
    <line x1="730" y1="466" x2="730" y2="490" stroke="#ee2929" stroke-width="1" opacity=".5"/>

  </svg>

  <div class="caption">
    <strong>Figure 1.</strong> EdgeRunner AI connects enterprise model development, GCC-level adaptation, and tactical execution into a single, continuously improving system. Open-weight models flow down; structured operational data flows up.
  </div>

</div>
</body>
</html>
