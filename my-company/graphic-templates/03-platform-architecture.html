<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EdgeRunner — Platform Architecture</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#191c20;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;justify-content:center;align-items:center;
       min-height:100vh;padding:20px}
  .canvas{width:1200px;background:#191c20;border-radius:12px;
          overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="canvas">

  <div style="padding:18px 32px 8px;text-align:center;border-bottom:2px solid #ee2929">
    <h1 style="color:#ffffff;font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase">EdgeRunner Platform Architecture</h1>
    <p style="color:#9f9f9f;font-size:15px;margin-top:4px">A modular, containerized AI runtime — ingests operational data, reasons with mission-trained models, delivers structured decision support</p>
  </div>

  <svg viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs>
      <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#ffffff"/>
      </marker>
      <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#ee2929"/>
      </marker>
    </defs>

    <!-- ===== OUTER CONTAINER ===== -->
    <!-- x=40 to x=1160, centered. Columns span x=52 to x=1148 (12px margin each side) -->
    <rect x="40" y="30" width="1120" height="400" rx="14" fill="rgba(238,41,41,.04)" stroke="#ee2929" stroke-width="1.5" stroke-dasharray="8,5"/>
    <text x="90" y="58" fill="#ee2929" font-size="13" font-weight="700" font-family="Segoe UI" letter-spacing=".5">EDGERUNNER SECURE RUNTIME</text>

    <!-- ===== INPUT SOURCES — x=52, width=170, cx=137 ===== -->
    <rect x="52" y="72" width="170" height="330" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="137" y="98" fill="#ffffff" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">INPUTS</text>

    <rect x="64" y="108" width="146" height="34" rx="6" fill="#1e2124" stroke="#393939"/>
    <text x="137" y="130" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Operational Orders</text>

    <rect x="64" y="150" width="146" height="34" rx="6" fill="#1e2124" stroke="#393939"/>
    <text x="137" y="172" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Intelligence Reports</text>

    <rect x="64" y="192" width="146" height="34" rx="6" fill="#1e2124" stroke="#393939"/>
    <text x="137" y="214" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Sensor / ISR Data</text>

    <rect x="64" y="234" width="146" height="34" rx="6" fill="#1e2124" stroke="#393939"/>
    <text x="137" y="256" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Force Status Updates</text>

    <rect x="64" y="276" width="146" height="34" rx="6" fill="#1e2124" stroke="#393939"/>
    <text x="137" y="298" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Docs / Procedures</text>

    <rect x="64" y="318" width="146" height="34" rx="6" fill="#1e2124" stroke="#393939"/>
    <text x="137" y="340" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">API / System Events</text>

    <!-- Arrow: Inputs → Layer 1 -->
    <line x1="222" y1="237" x2="264" y2="237" stroke="#ffffff" stroke-width="2" marker-end="url(#ar)"/>

    <!-- ===== LAYER 1: DATA INGESTION — x=266, width=190, cx=361 ===== -->
    <!-- Single rect only — no duplicate header rect -->
    <rect x="266" y="72" width="190" height="330" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="361" y="95" fill="#ffffff" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">DATA INGESTION</text>
    <text x="361" y="112" fill="#9f9f9f" font-size="12" font-family="Segoe UI" text-anchor="middle">Layer 1</text>

    <text x="361" y="140" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle">FUNCTIONS</text>
    <text x="361" y="160" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Multi-format parsing</text>
    <text x="361" y="180" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Schema normalization</text>
    <text x="361" y="200" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Structured representation</text>
    <text x="361" y="220" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Real-time streaming</text>
    <text x="361" y="240" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">OCR &amp; tokenization</text>

    <line x1="284" y1="258" x2="448" y2="258" stroke="#393939" stroke-width="1" opacity=".5"/>
    <text x="361" y="278" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle">OUTPUT</text>
    <text x="361" y="298" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Operational context</text>
    <text x="361" y="318" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">model ready for</text>
    <text x="361" y="338" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">AI processing</text>

    <!-- Arrow: L1 → L2 -->
    <line x1="456" y1="237" x2="498" y2="237" stroke="#ffffff" stroke-width="2" marker-end="url(#ar)"/>

    <!-- ===== LAYER 2: MISSION AI MODELS — x=500, width=190, cx=595 ===== -->
    <rect x="500" y="72" width="190" height="330" rx="10" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="2"/>
    <text x="595" y="95" fill="#ee2929" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">MISSION AI MODELS</text>
    <text x="595" y="112" fill="#c8c8c8" font-size="12" font-family="Segoe UI" text-anchor="middle">Layer 2 — Core Engine</text>

    <text x="595" y="140" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle">MODEL TYPES</text>
    <text x="595" y="160" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Open-weight base models</text>
    <text x="595" y="180" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Mission-specific fine-tunes</text>
    <text x="595" y="200" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">AFSC / domain LoRAs</text>
    <text x="595" y="220" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">20B param EdgeRunner model</text>
    <text x="595" y="240" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">1.6M military artifact trained</text>

    <line x1="518" y1="258" x2="682" y2="258" stroke="#ee2929" stroke-width="1" opacity=".3"/>
    <text x="595" y="278" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle">CAPABILITIES</text>
    <text x="595" y="298" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Situational understanding</text>
    <text x="595" y="318" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">COA generation</text>
    <text x="595" y="338" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Dependency analysis</text>

    <!-- Arrow: L2 → L3 -->
    <line x1="690" y1="237" x2="732" y2="237" stroke="#ffffff" stroke-width="2" marker-end="url(#ar)"/>

    <!-- ===== LAYER 3: REASONING ENGINE — x=734, width=190, cx=829 ===== -->
    <rect x="734" y="72" width="190" height="330" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="829" y="95" fill="#ffffff" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">REASONING ENGINE</text>
    <text x="829" y="112" fill="#9f9f9f" font-size="12" font-family="Segoe UI" text-anchor="middle">Layer 3 — Agentic</text>

    <text x="829" y="140" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle">FUNCTIONS</text>
    <text x="829" y="160" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Multi-step reasoning</text>
    <text x="829" y="180" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Tool use &amp; orchestration</text>
    <text x="829" y="200" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Workflow execution</text>
    <text x="829" y="220" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Domain framework alignment</text>
    <text x="829" y="240" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Transparent reasoning output</text>

    <line x1="752" y1="258" x2="916" y2="258" stroke="#393939" stroke-width="1" opacity=".5"/>
    <text x="829" y="278" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle">FRAMEWORKS</text>
    <text x="829" y="298" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">TM-BM (AFRL)</text>
    <text x="829" y="318" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">Mission-specific agents</text>
    <text x="829" y="338" fill="#c8c8c8" font-size="13" font-family="Segoe UI" text-anchor="middle">HELM / Inspect eval</text>

    <!-- Arrow: L3 → Outputs -->
    <line x1="924" y1="237" x2="966" y2="237" stroke="#ffffff" stroke-width="2" marker-end="url(#ar)"/>

    <!-- ===== OUTPUTS — x=968, width=180, cx=1058 ===== -->
    <!-- Inner boxes: x=980, width=158 — wider for text fit -->
    <rect x="968" y="72" width="180" height="330" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="1058" y="95" fill="#ffffff" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">OUTPUTS</text>
    <text x="1058" y="112" fill="#9f9f9f" font-size="12" font-family="Segoe UI" text-anchor="middle">Layer 4 — API</text>

    <!-- 6 output boxes, h=40, gap=7, font-size=12 for all labels -->
    <rect x="980" y="120" width="158" height="40" rx="6" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="1"/>
    <text x="1059" y="144" fill="#ffffff" font-size="12" font-family="Segoe UI" text-anchor="middle">COA Recommendations</text>

    <rect x="980" y="167" width="158" height="40" rx="6" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="1"/>
    <text x="1059" y="191" fill="#ffffff" font-size="12" font-family="Segoe UI" text-anchor="middle">Operational Analysis</text>

    <rect x="980" y="214" width="158" height="40" rx="6" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="1"/>
    <text x="1059" y="238" fill="#ffffff" font-size="12" font-family="Segoe UI" text-anchor="middle">Risk / Dependency Alerts</text>

    <rect x="980" y="261" width="158" height="40" rx="6" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="1"/>
    <text x="1059" y="285" fill="#ffffff" font-size="12" font-family="Segoe UI" text-anchor="middle">Structured Data Capture</text>

    <rect x="980" y="308" width="158" height="40" rx="6" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="1"/>
    <text x="1059" y="332" fill="#ffffff" font-size="12" font-family="Segoe UI" text-anchor="middle">Audit / Eval Records</text>

    <rect x="980" y="355" width="158" height="40" rx="6" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="1"/>
    <text x="1059" y="379" fill="#ffffff" font-size="12" font-family="Segoe UI" text-anchor="middle">Training Feedback</text>

    <!-- ===== DATA CAPTURE FEEDBACK ARC — below container ===== -->
    <!-- Arc starts below container bottom (y=430), curves down and back -->
    <path d="M 1058 432 Q 1058 458 600 458 Q 248 458 137 432" stroke="#ee2929" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr)" opacity=".6"/>
    <text x="600" y="474" fill="#ee2929" font-size="12" font-weight="700" font-family="Segoe UI" text-anchor="middle" opacity=".8">Structured operational data captured → feeds GCC refinement when connectivity permits</text>

  </svg>

  <div style="background:#111315;padding:10px 32px;display:flex;justify-content:space-between;align-items:center">
    <span style="color:#ee2929;font-size:13px;font-weight:700;opacity:.8;letter-spacing:.5px">EDGERUNNER AI</span>
    <span style="color:#9f9f9f;font-size:12px">TRL 7+ · Containerized · API-accessible · Zero external dependencies</span>
    <span style="color:#9f9f9f;font-size:12px">edgerunnerai.com</span>
  </div>

</div>
</body>
</html>
