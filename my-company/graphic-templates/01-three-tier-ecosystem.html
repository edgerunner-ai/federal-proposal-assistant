<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EdgeRunner — Three-Tier AI Ecosystem</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#191c20;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;justify-content:center;align-items:center;
       min-height:100vh;padding:20px}
  .canvas{width:1200px;background:#191c20;border-radius:12px;
          overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="canvas">

  <div style="padding:18px 32px 8px;text-align:center;border-bottom:2px solid #ee2929">
    <h1 style="color:#ffffff;font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase">Where EdgeRunner Fits — The AI Ecosystem</h1>
    <p style="color:#9f9f9f;font-size:15px;margin-top:4px">EdgeRunner connects enterprise AI investments to the tactical edge — and feeds operational learning back up the chain</p>
  </div>

  <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs>
      <marker id="ad" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#ffffff"/>
      </marker>
      <marker id="au" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#ee2929"/>
      </marker>
    </defs>

    <!-- ===== ENTERPRISE TIER ===== -->
    <rect x="60" y="22" width="1080" height="118" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="600" y="54" fill="#ffffff" font-size="22" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">ENTERPRISE TIER</text>
    <text x="600" y="76" fill="#9f9f9f" font-size="15" font-family="Segoe UI" text-anchor="middle">CDAO · Pentagon · National Labs · Cloud Infrastructure</text>

    <!-- 4 enterprise columns -->
    <line x1="330" y1="86" x2="330" y2="126" stroke="#393939" stroke-width="1" opacity=".5"/>
    <line x1="600" y1="86" x2="600" y2="126" stroke="#393939" stroke-width="1" opacity=".5"/>
    <line x1="870" y1="86" x2="870" y2="126" stroke="#393939" stroke-width="1" opacity=".5"/>
    <text x="195" y="106" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Frontier Model Development</text>
    <text x="465" y="106" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Security &amp; Governance</text>
    <text x="735" y="106" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Training Data Aggregation</text>
    <text x="1005" y="106" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Policy &amp; Standards</text>

    <!-- Enterprise pill -->
    <rect x="430" y="124" width="340" height="28" rx="14" fill="#ee2929"/>
    <text x="600" y="143" fill="#191c20" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">ENTERPRISE MODEL REGISTRY</text>

    <!-- Arrows Enterprise → GCC -->
    <line x1="430" y1="158" x2="430" y2="200" stroke="#ffffff" stroke-width="2" marker-end="url(#ad)"/>
    <line x1="770" y1="200" x2="770" y2="158" stroke="#ee2929" stroke-width="2" marker-end="url(#au)"/>
    <text x="444" y="180" fill="#c8c8c8" font-size="13" font-weight="600" font-family="Segoe UI">Approved Models</text>
    <text x="756" y="180" fill="#ee2929" font-size="13" font-weight="600" font-family="Segoe UI" text-anchor="end">Operational Data</text>

    <!-- Boundary -->
    <line x1="100" y1="183" x2="1100" y2="183" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="500" y="174" width="200" height="18" rx="9" fill="#222528" stroke="#4a4a4a" stroke-width="1"/>
    <text x="600" y="187" fill="#ffffff" font-size="11" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">SECURITY BOUNDARY</text>

    <!-- ===== GCC TIER ===== -->
    <rect x="60" y="207" width="1080" height="118" rx="10" fill="#2a2d31" stroke="#393939" stroke-width="1.5"/>
    <text x="600" y="239" fill="#ffffff" font-size="22" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">GCC / THEATER TIER</text>
    <text x="600" y="261" fill="#9f9f9f" font-size="15" font-family="Segoe UI" text-anchor="middle">SOCPAC · INDOPACOM · AFRL · IC Programs</text>

    <line x1="330" y1="271" x2="330" y2="311" stroke="#393939" stroke-width="1" opacity=".5"/>
    <line x1="600" y1="271" x2="600" y2="311" stroke="#393939" stroke-width="1" opacity=".5"/>
    <line x1="870" y1="271" x2="870" y2="311" stroke="#393939" stroke-width="1" opacity=".5"/>
    <text x="195" y="291" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Mission-Specific Fine-Tuning</text>
    <text x="465" y="291" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Benchmark &amp; Evaluation</text>
    <text x="735" y="291" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">LoRA Adapter Creation</text>
    <text x="1005" y="291" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Data Curation &amp; Validation</text>

    <!-- GCC pill -->
    <rect x="430" y="309" width="340" height="28" rx="14" fill="#ee2929"/>
    <text x="600" y="328" fill="#191c20" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">GCC MODEL REGISTRY</text>

    <!-- Arrows GCC → Edge -->
    <line x1="430" y1="343" x2="430" y2="385" stroke="#ffffff" stroke-width="2" marker-end="url(#ad)"/>
    <line x1="770" y1="385" x2="770" y2="343" stroke="#ee2929" stroke-width="2" marker-end="url(#au)"/>
    <text x="444" y="365" fill="#c8c8c8" font-size="13" font-weight="600" font-family="Segoe UI">Models + LoRAs</text>
    <text x="756" y="365" fill="#ee2929" font-size="13" font-weight="600" font-family="Segoe UI" text-anchor="end">Store &amp; Forward</text>

    <!-- DDIL Boundary -->
    <line x1="100" y1="368" x2="1100" y2="368" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="508" y="359" width="184" height="18" rx="9" fill="#222528" stroke="#4a4a4a" stroke-width="1"/>
    <text x="600" y="372" fill="#ffffff" font-size="11" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">DDIL BOUNDARY</text>

    <!-- ===== TACTICAL EDGE TIER ===== -->
    <rect x="60" y="392" width="1080" height="118" rx="10" fill="rgba(238,41,41,.08)" stroke="#ee2929" stroke-width="2"/>
    <text x="600" y="424" fill="#ee2929" font-size="22" font-weight="700" font-family="Segoe UI" text-anchor="middle" letter-spacing=".5">TACTICAL EDGE — EDGERUNNER AI</text>
    <text x="600" y="446" fill="#c8c8c8" font-size="15" font-family="Segoe UI" text-anchor="middle">Forward Deployed · DDIL · Air-Gapped · On-Device</text>

    <line x1="330" y1="456" x2="330" y2="496" stroke="#ee2929" stroke-width="1" opacity=".4"/>
    <line x1="600" y1="456" x2="600" y2="496" stroke="#ee2929" stroke-width="1" opacity=".4"/>
    <line x1="870" y1="456" x2="870" y2="496" stroke="#ee2929" stroke-width="1" opacity=".4"/>
    <text x="195" y="476" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Secure On-Device Inference</text>
    <text x="465" y="476" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Mission Agentic Workflows</text>
    <text x="735" y="476" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Operator Decision Support</text>
    <text x="1005" y="476" fill="#ffffff" font-size="17" font-family="Segoe UI" text-anchor="middle">Structured Data Capture</text>

    <!-- EdgeRunner badge -->
    <rect x="430" y="500" width="340" height="28" rx="14" fill="rgba(238,41,41,.15)" stroke="#ee2929" stroke-width="1.5"/>
    <text x="600" y="519" fill="#ee2929" font-size="15" font-weight="700" font-family="Segoe UI" text-anchor="middle">NO CLOUD DEPENDENCY · NO DATA EGRESS</text>

  </svg>

  <div style="background:#111315;padding:10px 32px;display:flex;justify-content:space-between;align-items:center">
    <span style="color:#ee2929;font-size:13px;font-weight:700;opacity:.8;letter-spacing:.5px">EDGERUNNER AI</span>
    <span style="color:#9f9f9f;font-size:12px">EdgeRunner closes the gap between enterprise AI investment and operational use — in any environment</span>
    <span style="color:#9f9f9f;font-size:12px">edgerunnerai.com</span>
  </div>

</div>
</body>
</html>
